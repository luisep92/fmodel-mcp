[project]
name = "fmodel-mcp-server"
version = "0.1.0"
description = "MCP server wrapping the fmodel-cli .NET binary for Unreal Engine asset access"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "mcp>=1.0",
]

[project.scripts]
fmodel-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

